DATA:
  IMG_SIZE: 384
  BATCH_SIZE: 6  # 建议在这里设小一点，防止读取默认的24导致显存溢出

MODEL:
  TYPE: swin
  NAME: swin_base_patch4_window12_384_22k
  DROP_PATH_RATE: 0.2
  PRETRAIN_CKPT: "./pretrained_ckpt/swin_base_patch4_window12_384_22k.pth"
  
  SWIN:
    FINAL_UPSAMPLE: "expand_first"
    EMBED_DIM: 128              # Base 是 128
    DEPTHS: [ 2, 2, 18, 2 ]     # Base Encoder 深度
    DECODER_DEPTHS: [ 2, 2, 6, 2 ] 
    
    NUM_HEADS: [ 4, 8, 16, 32 ] # Base Heads
    WINDOW_SIZE: 12             # 必须是 12 以匹配 384
    APE: False                  # Swin V1 Base 384 通常不使用绝对位置编码(APE)